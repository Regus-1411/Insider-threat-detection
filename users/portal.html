<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Portal — Acme Corp</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- ══════════ HEADER ══════════ -->
<header class="portal-header">
    <div class="brand">Acme <span>Corp</span></div>
    <div class="header-right">
        <div class="user-info">Logged in as <strong id="userName">—</strong></div>
        <span class="dept-badge" id="deptBadge">—</span>
        <button class="btn-logout" id="logoutBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sign Out
        </button>
    </div>
</header>

<!-- ══════════ MAIN ══════════ -->
<main class="portal-body">

    <!-- Welcome + quick stats -->
    <div class="welcome-section">
        <div>
            <h1 id="welcomeTitle">Welcome back</h1>
            <p class="welcome-sub" id="welcomeSub">Your workspace is ready.</p>
        </div>
        <div class="quick-stats">
            <div class="qs-item">
                <div class="qs-value" id="statActions">0</div>
                <div class="qs-label">Actions Today</div>
            </div>
            <div class="qs-item">
                <div class="qs-value" id="statTime">—</div>
                <div class="qs-label">Session Started</div>
            </div>
        </div>
    </div>

    <!-- Department workspace -->
    <div class="workspace" id="workspace">
        <div class="loading-msg">Loading your workspace…</div>
    </div>

</main>

<!-- Toast -->
<div id="toast"></div>

<script src="portal.js"></script>
</body>
</html>
