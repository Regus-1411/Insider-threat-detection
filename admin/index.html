<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Insider Threat Monitor</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="login-wrap">
    <div class="login-card">
        <h1>Admin Portal</h1>
        <p class="sub">Insider Threat Detection System</p>

        <form id="loginForm" novalidate>
            <div class="field">
                <label for="email">Admin Email</label>
                <input type="email" id="email" placeholder="admin@company.com" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
            </div>

            <div class="error-msg" id="errorMsg"></div>

            <button type="submit" class="btn-primary" id="submitBtn">Sign In</button>
        </form>
    </div>
</div>
<script src="login.js"></script>
</body>
</html>
